name: digit_installer
description: >
  A modern, self-hosted APK auto-updater for Flutter — PackageInstaller
  Session API installs with real-time progress and MDM/kiosk silent updates,
  a Dart 3 sealed-class state machine, custom-header auth, and SHA-256 +
  APK-signature + TLS-pin verification. No Play Store or Play Services.
version: 0.1.0
homepage: https://justunknown.com

environment:
  sdk: ^3.4.3
  flutter: ">=3.3.0"

dependencies:
  flutter:
    sdk: flutter
  plugin_platform_interface: ^2.1.8
  digit_downloader: ^0.1.0
  http: ^1.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  plugin:
    platforms:
      android:
        package: com.egov.digit_installer
        pluginClass: DigitInstallerPlugin
        dartPluginClass: MethodChannelDigitInstaller
      ios:
        dartPluginClass: DigitInstallerIos
      windows:
        dartPluginClass: DigitInstallerDesktop
      macos:
        dartPluginClass: DigitInstallerDesktop
      linux:
        dartPluginClass: DigitInstallerDesktop

